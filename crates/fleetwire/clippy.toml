# fleetwire is a GET-only read library. The single POST it makes — the token refresh in
# `auth/refresh.rs` — carries an explicit `allow`.
# This list is a backstop. The primary defence is that the public API has no write path (the endpoint
# trait is sealed) and that every modelled endpoint issues a GET.
# It applies to the fleetwire crate only.
# The entries were collected by reading ureq 3.3.0's agent.rs, lib.rs, config.rs and request_ext.rs in
# full. When ureq is upgraded, re-read those files for new methods or new ways to build an `Agent`.
# Test code may use unwrap and panic! (the `unwrap_used` and `panic` lints bind product code only).
allow-unwrap-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
  { path = "ureq::Agent::post",    reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::put",     reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::patch",   reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::delete",  reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::head",    reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::options", reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::connect", reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::trace",   reason = "fleetwire is GET-only" },
  { path = "ureq::Agent::run",     reason = "it lets the caller pick an arbitrary HTTP method" },
  { path = "ureq::run",            reason = "it lets the caller pick an arbitrary HTTP method" },
  { path = "ureq::get",            reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::post",           reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::put",            reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::patch",          reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::delete",         reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::head",           reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::options",        reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::connect",        reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::trace",          reason = "it bypasses the Agent configuration (redirects, proxy)" },
  { path = "ureq::agent",                       reason = "build the Agent only in net::agent" },
  { path = "ureq::Agent::new_with_defaults",    reason = "build the Agent only in net::agent" },
  { path = "ureq::Agent::new_with_config",      reason = "build the Agent only in net::agent" },
  { path = "ureq::config::Config::new_agent",   reason = "build the Agent only in net::agent" },
  { path = "ureq::RequestExt::with_agent",         reason = "it lets an http::Request carry an arbitrary HTTP method" },
  { path = "ureq::RequestExt::with_default_agent", reason = "it lets an http::Request carry an arbitrary HTTP method" },
]
