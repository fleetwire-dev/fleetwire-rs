[package]
name = "fleetwire"
version = "0.1.0"
description = "Unofficial read-only client for the Tesla Fleet API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/fleetwire"
keywords = ["tesla", "fleet", "api", "http-client", "vehicle"]
categories = ["api-bindings", "web-programming::http-client"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"
# The synchronous HTTPS backend (rustls, ring, webpki-roots). It is configured in one place: `src/net.rs::agent`.
ureq = { version = "3", default-features = false, features = ["rustls"] }
percent-encoding = "2"
regex = "1"
base64 = { version = "0.23", default-features = false, features = ["std"] }

# The type behind the public `fleetwire::Url` (host checks, path assembly).
url = "2"

# Parses the HTTP-date form of Retry-After (RFC 9110); std has no date parser.
httpdate = "1"

[dev-dependencies]
# The mock HTTP server the tests use (std only; a dev-dependency, so it never enters a consumer's tree).
fleetwire-testkit = { path = "../fleetwire-testkit" }

[package.metadata.docs.rs]
all-features = true
