# Test code may use unwrap and panic! (the `unwrap_used` and `panic` lints bind product code only).
allow-unwrap-in-tests = true
allow-panic-in-tests = true

# Functions with one sanctioned alternative, each with its reason (workspace lint
# `disallowed_methods = "deny"`).
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "it follows symbolic links; files here are opened with O_NOFOLLOW, so use the path as given" },
  { path = "std::env::home_dir", reason = "it depends on the account running the process; take paths from arguments or configuration" },
]
