# gitleaks configuration. The default rules apply; only values the tests plant on purpose are allowed,
# each with its reason.
[extend]
useDefault = true

# Fake secret-shaped strings the redaction tests use as input.
[[allowlists]]
description = "fake secret-shaped strings used by redaction tests"
regexTarget = "line"
regexes = [
  '''NA_a1b2c3d4e5f6g7''',
  '''eyJzdWIiOiIxMjM0NTY3ODkwIn0''',
]
