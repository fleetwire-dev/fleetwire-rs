# gitleaks 설정입니다. 기본 규칙을 그대로 쓰고, 시험이 일부러 넣은 값만 이유와 함께 허용합니다.
[extend]
useDefault = true

# 가림(redaction) 시험이 「비밀처럼 생긴 값」으로 쓰는 가짜 문자열입니다.
[[allowlists]]
description = "fake secret-shaped strings used by redaction tests"
regexTarget = "line"
regexes = [
  '''NA_a1b2c3d4e5f6g7''',
  '''eyJzdWIiOiIxMjM0NTY3ODkwIn0''',
]
