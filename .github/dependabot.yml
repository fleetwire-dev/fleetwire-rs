version: 2
updates:
  # Cargo version updates are not opened here: Cargo.lock is generated
  # upstream and exported into this repository, so a lockfile bump merged
  # here would be overwritten by the next export. Dependabot security
  # alerts for Cargo dependencies stay enabled in the repository settings.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
