name: release
# Runs when a version tag (v*) is pushed: publishes the crate to crates.io, then creates the GitHub
# release from the matching CHANGELOG section. The publish job waits for approval through the
# `crates-io` environment; a published version can be yanked but never deleted.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: tag matches the crate version and the changelog
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "fleetwire") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "^## \[$version\]" CHANGELOG.md
      - run: cargo +stable test --workspace --all-targets --all-features --locked
      - run: cargo +stable test --workspace --doc --all-features --locked
      # A tag does not wait for CI, so the semver check runs here too: a breaking change against
      # the newest release on crates.io fails before anything is published. The action caches the
      # baseline's rustdoc; its own key prefix keeps that cache apart from the CI job's. A bad
      # cache could only make this check pass wrongly; the published crate is built from source.
      - name: semver check against crates.io
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: fleetwire
          prefix-key: release
      # Trusted publishing: crates.io trades this job's OIDC token for a short-lived publish token,
      # and the action revokes it when the job ends. No registry token is stored in the repository.
      # crates.io accepts the exchange only from this repository, this workflow file and the
      # `crates-io` environment, as configured on the crate's settings page.
      - name: get a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo +stable publish -p fleetwire --locked

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { on = (index($0, "## [" v "]") == 1); next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "fleetwire $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
