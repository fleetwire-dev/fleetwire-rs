[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

# `webpki-roots` is data (the Mozilla CA root bundle), not code, and is distributed under
# CDLA-Permissive-2.0. It is allowed for this one crate only, so the licence cannot spread to another
# dependency unnoticed.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `fleetwire-testkit` is a path-only dev-dependency that is never published, so it has no version.
# This allows wildcards for path dependencies only; `foo = "*"` from crates.io is still an error.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
