[workspace]
resolver = "3"
members = ["crates/fleetwire", "crates/fleetwire-testkit"]

# Versions of the dependencies both crates share, pinned in one place.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fleetwire-dev/fleetwire-rs"
homepage = "https://github.com/fleetwire-dev/fleetwire-rs"
authors = ["Jeong Seung Hwan <4435353+draken1@users.noreply.github.com>"]

# No crate in this workspace uses unsafe code.
[workspace.lints.rust]
unsafe_code = "forbid"

# clippy.toml only takes effect with this lint enabled.
[workspace.lints.clippy]
disallowed_methods = "deny"
# Product code must not panic. Tests are exempt through allow-*-in-tests in clippy.toml.
unwrap_used = "deny"
panic = "deny"
unchecked_time_subtraction = "deny"
